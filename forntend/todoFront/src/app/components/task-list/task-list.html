<div class="d-flex justify-content-center title">
    <h1>Hello, <span class="span-title">Start planning today</span></h1>
</div>


<div class="mx-5 d-flex justify-content-between primary-bg m-1 px-5 py-5 rounded-4" >
    <div class=" w-50">
        <h2 class="font">sunday</h2>
        <h3 class="font">29, septemper 2026</h3>
        <img class="w-100 " src="https://plus.unsplash.com/premium_vector-1731471747401-fae8e5ef2021?q=80&w=1063&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
    </div>

    <div class=" w-100 mx-2">
        <div class="d-flex flex-row-reverse mb-5">
            <form #createForm="ngForm" (ngSubmit)="onSubmit()">
                <input
                type="text" 
                class="add-task" 
                placeholder="type title of task" 
                name="title"
                [(ngModel)]="newTask.title"
                >
                <button type="submit" class="add-btn bg-success" >+</button>
            </form>
        </div>
        <div class="d-flex justify-content-between">
            <div></div>
            <div class="border-search">
                <input class="search" type="search by name" name="" placeholder="search for task" id="">
                <a href="">
                    <img style="height: 25px;" src="search.png" alt="">
                </a>
            </div>
        </div>
        <!-- cards -->
        <div class="row  my-2"> 
            
            @for (task of apiTask.tasks(); track $index) {
            <div class="col-sm-6 my-2">
                <div class="d-flex card card-bg py-4 ps-5 flex-row justify-content-between rounded-4">
                    <div class class="fixed-width ">
                        @if (editingTaskId !== task.id) {
                            <h3 [class]="task.isCompleted ? 'text-decoration-line-through' : ''">{{task.title}}</h3>
                        }
                        @else{
                            <input 
                            type="text"
                            [(ngModel)]="editTitle"
                            name="editTitle"
                            (keyup.enter)="saveEdit(task)"
                            
                            (keyup.escape)="cancelEdit()"
                            >
                            
                        }
                        
                        <div class="description">
                            <p>description </p>
                        </div>
                        <h4>start date:{{task.createdAt | date}}</h4>
                    </div>
                    <div class=" d-flex flex-column my-3 justify-content-between align-items-center" >
                        <button class="btn d-flex flex-row-reverse w-75" (click)="completed(task)"><img class="w-25" src="checkbox.png" alt=""></button>
                        <button class="btn d-flex flex-row-reverse w-75" (click)="startEdit(task)"><img class="w-25" src="edit.png" alt=""></button>
                        <button class="btn d-flex flex-row-reverse w-75" (click)="delete(task.id)"><img class="w-25" src="trash.png" alt=""></button>
                    </div>
                </div>
            </div>
        }
            
        </div>
        <!-- end cards -->
    </div>
</div>
